{% extends "base.html" %}
{% block title %} Auction Query HUB {% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header">
                        <h3 class="mb-0">Create User</h3>
                    </div>
                    <div class="card-body">
                        <div id="message" class="alert d-none" role="alert"></div>
                        <form id="user-form" method="POST" data-url="{% url 'create_user' %}" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="{{ form.username.id_for_label }}" class="form-label"> Username </label>
                                {{ form.username }}
                                <div id="username-error" class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.email.id_for_label }}" class="form-label"> Email </label>
                                {{ form.email }}
                                <div id="email-error" class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.password.id_for_label }}" class="form-label"> Password </label>
                                {{ form.password }}
                                <div id="password-error" class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.role.id_for_label }}" class="form-label"> Role </label>
                                {{ form.role }}
                                <div id="role-error" class="text-danger small mt-1"></div>
                            </div>

                            <button type="submit" id="submit-button" class="btn btn-primary w-100"> Create User </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
